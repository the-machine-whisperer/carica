# --- Engagement signal sources (not outlets; S1 reads these to score engagement) ---
engagement_sources:
  - id: rotter
    name: "Rotter.net Scoops forum"
    url: https://rotter.net/forum/scoops1/
    kind: forum
    notes: >
      A genuine Israeli political-buzz leading indicator — stories often surface here before
      mainstream pickup. Unrepresentative and heavily skewed; use as a VELOCITY signal for
      controversy, never as a proxy for public opinion, and never as a source for S6.

  - id: telegram_public
    name: "Public Telegram news channels"
    kind: telegram
    notes: >
      Major distribution channel in Israel. Read the public web view of a public channel
      (t.me/s/<channel>), which needs no account, no bot and no token — this pipeline has
      no credentials. Private or invite-only channels are simply out of scope.

# --- Ownership independence classes, used by S6 ---
# S6 requires 2 INDEPENDENT sources to mark a claim verified. Outlets sharing an owner
# do not count as independent. This encodes the Israeli media concentration that makes
# naive "two sources" checks worthless.
ownership_groups:
  yedioth: [ynet, calcalist]
  azur: [maariv, jpost, globes]
  keshet: [mako_n12]
  toi_group: [toi, zman]

    language: he
    lean: left
    ownership: "Schocken family / M. DuMont Schauberg"
    paywall: hard
    authority_prior: 78
    notes: >
      Hard paywall. Headline + dek only — never attempt full-text retrieval. Agenda-setting
      well above its traffic share, which is why authority_prior exceeds its reach.
    feeds:
      - url: https://www.haaretz.co.il/srv/rss---feedly
        kind: rss
        section: news

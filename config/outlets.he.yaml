# Israeli outlet registry — the seed universe for S1 (outlet ranking).
#
# WHAT THIS FILE IS: a curated candidate list with slow-moving metadata (ownership,
# lean, paywall posture). It is NOT the ranking. S1 ranks these at run time from live
# signals and records evidence for every number.
#
# FEED URLS ARE SEEDS, NOT FACTS. Israeli outlets change feed paths without notice.
# S1 fetches each feed and sets `verified: true` in 01_outlets.json only for feeds that
# actually parsed. A feed that 404s becomes a recorded gap, never a silent omission.
#
# `authority_prior` is a slow signal (0-100) from TGI/Kantar exposure and general standing,
# refreshed roughly annually. It is a PRIOR — live reach and engagement dominate the composite.

meta:
  market: israel
  language_primary: he
  refreshed: 2026-08-15
  authority_prior_source: >
    TGI (Target Group Index) Israel, run by Kantar Media under the Israeli Advertising
    Association. Measures press and radio exposure, not web traffic — treat as a standing
    prior only. 2025 wave: daily-press exposure 34.3% overall, Israel Hayom 21.8%,
    Yedioth Ahronoth 16.1%.

outlets:
  - id: ynet
    name_he: "ynet"
    name_en: "Ynet (Yedioth Ahronoth)"
    homepage: https://www.ynet.co.il
    language: he
    lean: center
    ownership: "Yedioth Ahronoth Group"
    paywall: partial
    authority_prior: 95
    notes: >
      Consistently the highest-traffic Israeli news site and typically a top-3 site of any
      kind in Israel. Talkback (comment) volume is a strong and publicly visible controversy
      signal — one of the few Israeli outlets that exposes it cheaply.
    feeds:
      - url: https://www.ynet.co.il/Integration/StoryRss2.xml
        kind: rss
        section: news
      - url: https://www.ynet.co.il/Integration/StoryRss1204.xml
        kind: rss
        section: politics

  - id: mako_n12
    name_he: "mako / N12"
    name_en: "Mako / N12 (Channel 12, Keshet)"
    homepage: https://www.mako.co.il
    language: he
    lean: center
    ownership: "Keshet Media Group"
    paywall: none
    authority_prior: 90
    notes: "Channel 12 is the highest-rated TV news brand; N12 is its web arm."
    feeds:
      - url: https://rcs.mako.co.il/rss/news-israel.xml
        kind: rss
        section: israel
      - url: https://rcs.mako.co.il/rss/news-military.xml
        kind: rss
        section: security

  - id: walla
    name_he: "וואלה"
    name_en: "Walla!"

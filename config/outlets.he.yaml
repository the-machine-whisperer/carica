    language: he
    lean: center
    ownership: "Communication and Digital Media (formerly Bezeq)"
    paywall: none
    authority_prior: 80
    feeds:
      - url: https://rss.walla.co.il/feed/22
        kind: rss
        section: news

  - id: israel_hayom
    name_he: "ישראל היום"
    name_en: "Israel Hayom"
    homepage: https://www.israelhayom.co.il
    language: he
    lean: right
    ownership: "Miriam Adelson"
    paywall: none
    authority_prior: 88
    notes: "Free daily; leads TGI print exposure. Free distribution inflates print reach relative to web traffic — do not conflate the two."
    feeds:
